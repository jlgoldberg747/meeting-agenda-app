<body>
<div id="app"></div>
<script>

function handleFile(file){const ext=file.name.split('.').pop().toLowerCase();if(ext==='csv'||ext==='tsv'){const r=new FileReader();r.onload=e=>{impRows(Papa.parse(e.target.result,{header:true,skipEmptyLines:true}).data,null)};r.readAsText(file)}else if(ext==='xlsx'||ext==='xls'){const r=new FileReader();r.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array',raw:true});let ms=null,as=null;for(const n of wb.SheetNames){const nl=n.toLowerCase();if(nl.includes('meta'))ms=wb.Sheets[n];if(nl.includes('agenda')||nl.includes('detail'))as=wb.Sheets[n]}if(!as&&wb.SheetNames.length>=2){ms=wb.Sheets[wb.SheetNames[0]];as=wb.Sheets[wb.SheetNames[1]]}else if(!as)as=wb.Sheets[wb.SheetNames[0]];let meta=null;if(ms){meta={};XLSX.utils.sheet_to_json(ms,{header:1,defval:'',raw:true}).forEach(row=>{if(!row[0])return;const k=String(row[0]).toLowerCase().trim(),v=row[1];if(k.includes('organisation'))meta.org=String(v||'');if(k.includes('title'))meta.title=String(v||'');if(k.includes('subtitle'))meta.subtitle=String(v||'');if(k.includes('date'))meta.date=String(v||'');if(k.includes('location'))meta.location=String(v||'');if(k.includes('facilitator'))meta.facilitator=String(v||'');if(k.includes('start time'))meta.startTime=pxT(v)})}impRows(XLSX.utils.sheet_to_json(as,{defval:'',raw:true}),meta)};r.readAsArrayBuffer(file)}}
function pxT(v){if(v==null)return null;if(typeof v==='string'){const m=v.match(/(\d{1,2}):(\d{2})/);if(m)return`${String(m[1]).padStart(2,'0')}:${m[2]}`;const n=parseFloat(v);if(!isNaN(n)&&n>0&&n<1)return m2t(Math.round(n*1440));return null}if(typeof v==='number'&&v>=0&&v<1)return m2t(Math.round(v*1440));return null}
function impRows(rows,meta){if(!rows.length)return;if(meta)Object.entries(meta).forEach(([k,v])=>{if(v&&k!=='startTime')S.meeting[k]=v;if(k==='startTime'&&v)S.startTime=v});const keys=Object.keys(rows[0]);const fc=h=>keys.find(k=>h.some(x=>k.toLowerCase().includes(x)))||null;const cT=fc(['topic','title','session']),cO=fc(['obj','objective','description']),cI=fc(['illus','illustration','visual']),cA=fc(['approach','method','notes']),cS=fc(['start']),cE=fc(['end','finish']),cF=fc(['format','fmt','type']);const ns=[];let pe=null;rows.forEach(r=>{const tr=r[cT];if(!tr&&!r[cE])return;const title=String(tr||'').trim();if(!title)return;let st=pxT(r[cS]),et=pxT(r[cE]);if(!st&&pe)st=pe;if(!st&&meta?.startTime)st=meta.startTime;let dur=30;if(st&&et){dur=t2m(et)-t2m(st);if(dur<=0)dur=30}pe=et||m2t(t2m(st||S.startTime)+dur);if(!ns.length&&st)S.startTime=st;const isB=/break|lunch|tea|coffee|pause/i.test(title);const fmtRaw=cF?String(r[cF]||'').trim().toUpperCase():'';const fmtValid=FMTS.find(f=>f.c===fmtRaw);const fmt=fmtValid?fmtRaw:(isB?'BRK':'O');ns.push({id:S.nextId++,dur,title,obj:String(r[cO]||'').trim().replace(/\\n/g,'\n'),illus:String(r[cI]||'').trim(),approach:String(r[cA]||'').trim().replace(/\\n/g,'\n'),fmt,isBreak:isB||fmt==='BRK'})});if(ns.length){S.sessions=ns;R()}}
function exportAg(){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Organisation',S.meeting.org],['Meeting Title',S.meeting.title],['Subtitle',S.meeting.subtitle],['Date',S.meeting.date],['Location',S.meeting.location],['Facilitator',S.meeting.facilitator],['Start Time',S.startTime]]),'Meeting metadata');const cc=calc();const ad=[['Start','Finish','Format','Topic','Objective','Illustration','Approach']];cc.forEach(c=>ad.push([c.sT,c.eT,c.fmt||'',c.title,c.obj||'',c.illus||'',c.approach||'']));const ws2=XLSX.utils.aoa_to_sheet(ad);ws2['!cols']=[{wch:10},{wch:10},{wch:8},{wch:22},{wch:35},{wch:18},{wch:45}];XLSX.utils.book_append_sheet(wb,ws2,'Detailed agenda');const fmtData=[['Format types']];FMTS.forEach(f=>fmtData.push([`${f.c} — ${f.l}`]));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(fmtData),'List');XLSX.writeFile(wb,`${S.meeting.title.replace(/[^a-zA-Z0-9 ]/g,'')}_Agenda.xlsx`)}

function applyBrand(txt){const vars={};[[/teal[:\s]+([#][0-9a-fA-F]{3,8})/i,'--teal'],[/navy[:\s]+([#][0-9a-fA-F]{3,8})/i,'--navy'],[/accent[:\s]+([#][0-9a-fA-F]{3,8})/i,'--teal'],[/background[:\s]+([#][0-9a-fA-F]{3,8})/i,'--bg'],[/coral[:\s]+([#][0-9a-fA-F]{3,8})/i,'--coral']].forEach(([re,vn])=>{const m=txt.match(re);if(m)vars[vn]=m[1]});[[/(?:display|heading)[\s-]*font[:\s]+['"]?([^'",\n]+)/i,'--fn'],[/mono[\s-]*font[:\s]+['"]?([^'",\n]+)/i,'--fm']].forEach(([re,vn])=>{const m=txt.match(re);if(m)vars[vn]=`'${m[1].trim()}',sans-serif`});Object.entries(vars).forEach(([k,v])=>document.documentElement.style.setProperty(k,v))}
